# just verify: typecheck, design tokens, all component gates (no specimen links), ws check; run: just ci run verify.yml
# On demand only (owner decision 2026-10-14): no push or pull_request trigger. The manifest is in CONTRIBUTING.md.
# The dotfiles repository is private: ws, secrets and remote are cloned from it into $RUNNER_TEMP
# (outside the repository) with the DOTFILES_TOKEN secret, a fine-grained token that reads its contents.
name: verify
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch ws, secrets and remote (private dotfiles, read-only token)
        env:
          DOTFILES_TOKEN: ${{ secrets.DOTFILES_TOKEN }}
        run: |
          if [ -z "$DOTFILES_TOKEN" ]; then
            echo "::error::add the DOTFILES_TOKEN repository secret: a fine-grained token with read access to Rengod95/dotfiles contents"
            exit 1
          fi
          git clone --quiet --depth 1 "https://x-access-token:${DOTFILES_TOKEN}@github.com/Rengod95/dotfiles.git" "$RUNNER_TEMP/ws-dotfiles"
          for m in ws secrets remote; do echo "$RUNNER_TEMP/ws-dotfiles/modules/$m/bin" >>"$GITHUB_PATH"; done
      - uses: jdx/mise-action@v2
      - name: just verify
        run: just verify
