# CI: just verify. The dotfiles repository is private: ws, secrets and remote come from it with the DOTFILES_TOKEN
# secret (a fine-grained token that reads its contents). No secret value is written here.
name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the DOTFILES_TOKEN secret
        env:
          DOTFILES_TOKEN: ${{ secrets.DOTFILES_TOKEN }}
        run: |
          if [ -z "$DOTFILES_TOKEN" ]; then
            echo "::error::add the DOTFILES_TOKEN repository secret: a fine-grained token with read access to Rengod95/dotfiles contents"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: Rengod95/dotfiles
          token: ${{ secrets.DOTFILES_TOKEN }}
          path: .ws-dotfiles
      - uses: jdx/mise-action@v2
      - name: Put ws, secrets and remote on PATH
        run: |
          echo "$GITHUB_WORKSPACE/.ws-dotfiles/modules/ws/bin" >>"$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.ws-dotfiles/modules/secrets/bin" >>"$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.ws-dotfiles/modules/remote/bin" >>"$GITHUB_PATH"
      - name: just verify
        run: just verify
